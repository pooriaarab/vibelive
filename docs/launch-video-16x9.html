<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vibelive — launch (16:9)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg-0:#07080b;
    --panel:#101319;
    --panel-2:#0c0e13;
    --edge:rgba(255,255,255,.07);
    --text-0:#e8eaf0;
    --text-1:#9aa3b8;
    --text-2:#5c6478;
    --amber:#f5a524; --amber-ink:#241a04; --amber-rgb:245,165,36;
    --red:#e5484d;   --red-rgb:229,72,77;
    --blue:#3b82f6;  --blue-rgb:59,130,246;
    --green:#3ddc84;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
  }
  body{ display:flex; align-items:center; justify-content:center; }

  /* ---- fixed 1920x1080 canvas, scaled to fit ---- */
  .canvas{
    position:fixed; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:center center;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(120% 90% at 15% -10%, #12151d 0%, transparent 55%),
      radial-gradient(100% 80% at 110% 8%, #14131a 0%, transparent 50%),
      var(--bg-0);
    overflow:hidden;
  }
  /* cinematic vignette */
  .canvas::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 42%, transparent 58%, rgba(0,0,0,.55) 100%);
    z-index:40;
  }

  /* ============ TERMINAL SCENE ============ */
  .terminal{
    position:absolute; left:90px; top:105px;
    width:1740px; height:870px;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:24px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.05) inset,
      0 60px 135px -45px rgba(0,0,0,.8),
      0 21px 45px -24px rgba(0,0,0,.6);
    overflow:hidden;
    z-index:10;
    /* lonely beat starts desaturated + dim; color returns on join */
    filter:grayscale(1) brightness(.84) contrast(.96);
    transition:filter 1.5s cubic-bezier(.16,1,.3,1),
               transform 1.1s cubic-bezier(.16,1,.3,1),
               opacity .9s ease;
    transform-origin:center center;
  }
  .terminal.alive{ filter:grayscale(0) brightness(1) contrast(1); }
  .terminal.recede{ transform:scale(1.045); filter:blur(10px) brightness(.5); opacity:.16; }

  .titlebar{
    display:flex; align-items:center; gap:18px;
    height:60px; padding:0 21px;
    background:linear-gradient(180deg,#14171f,#101218);
    border-bottom:1px solid var(--edge);
  }
  .traffic{ display:flex; gap:10px; }
  .traffic .dot{ width:16px; height:16px; border-radius:50%; }
  .traffic .red{ background:#ff5f57; }
  .traffic .yellow{ background:#febc2e; }
  .traffic .green{ background:#28c840; }
  .path{
    flex:1; text-align:center;
    font:19px/1 var(--mono); color:var(--text-2); letter-spacing:.01em;
  }

  .tb-right{ display:flex; align-items:center; gap:18px; position:relative; }
  .presence{ display:flex; align-items:center; position:relative; height:45px; }
  .avatar{
    width:39px; height:39px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font:700 16px/1 var(--sans);
    border:3px solid #14171f;
    margin-left:-12px;
    position:relative;
    transform:scale(0); opacity:0;
    transition:transform .5s cubic-bezier(.16,1.4,.4,1), opacity .3s ease;
  }
  .presence .avatar:first-child{ margin-left:0; }
  .avatar.entered{ transform:scale(1); opacity:1; }
  .avatar.host::after{
    content:"★"; position:absolute; right:-6px; bottom:-6px;
    font-size:13px; color:var(--amber);
    text-shadow:0 0 3px #000, 0 0 3px #000;
  }
  /* who holds the write token */
  .driver-ring{
    position:absolute; top:-6px; width:51px; height:51px;
    border-radius:50%; border:3px solid var(--amber);
    box-shadow:0 0 0 4px rgba(245,165,36,.18), 0 0 21px rgba(245,165,36,.5);
    transition:left .7s cubic-bezier(.16,1,.3,1), border-color .4s ease, box-shadow .4s ease;
    pointer-events:none; opacity:0;
  }
  .driver-ring.on{ opacity:1; }

  /* ---- terminal body ---- */
  .term-body{
    position:absolute; left:0; right:0; top:60px; height:675px;
    padding:30px 33px 18px;
  }
  .term-header{ display:flex; align-items:center; gap:18px; margin-bottom:24px; }
  .mascot{ flex:0 0 auto; filter:drop-shadow(0 4px 10px rgba(245,165,36,.25)); }
  .mascot-svg{ animation:bob 3.1s ease-in-out infinite alternate; }
  .mascot .eyes{ transform-origin:center; animation:blink 4.8s infinite; }
  @keyframes bob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }
  @keyframes blink{ 0%,94%,100%{ transform:scaleY(1); } 97%{ transform:scaleY(.12); } }

  .welcome{ font:600 24px/1.2 var(--sans); color:var(--text-0); }
  .welcome .name{ color:var(--amber); }
  .subline{ margin-top:5px; font:19px/1 var(--mono); color:var(--text-2); }

  .term-feed{
    height:450px; overflow:hidden;
    display:flex; flex-direction:column; gap:8px;
    font:20px/1.7 var(--mono);
    mask-image:linear-gradient(to bottom, transparent 0, #000 24px, #000 calc(100% - 12px), transparent 100%);
  }
  .line{ white-space:pre-wrap; word-break:break-word; padding:2px 9px; border-radius:7px; }
  .line .bullet{ color:var(--text-2); margin-right:6px; }
  .line.agent{ color:var(--text-0); }
  .line.agent .you{ color:var(--amber); }
  .line.tool .tn{ color:#c9a6ff; font-weight:600; }
  .line.tool .ta{ color:var(--text-1); }
  .line.ok{ color:var(--green); }
  .line.sys{ color:var(--text-2); font-style:italic; }
  .line.caret::after{
    content:"▌"; color:var(--amber); margin-left:2px;
    animation:cb 1s steps(2) infinite;
  }
  @keyframes cb{ 50%{ opacity:0; } }
  .diff{ display:flex; flex-direction:column; gap:3px; margin:3px 0 3px 33px; font:19px/1.6 var(--mono); }
  .diff .del{ background:rgba(229,72,77,.12); color:#ffb3b3; border-radius:6px; padding:2px 12px; }
  .diff .add{ background:rgba(18,176,134,.14); color:#8be9c9; border-radius:6px; padding:2px 12px; }

  /* ---- cursor layer ---- */
  .cursor-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:6; }
  .cursor{
    position:absolute; top:0; left:0;
    transform:translate3d(60px,90px,0);
    will-change:transform;
    display:flex; align-items:flex-start;
    opacity:0;
    transition:transform 1.2s cubic-bezier(.65,0,.35,1), opacity .45s ease;
  }
  .cursor svg{ width:27px; height:27px; display:block; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .cursor-label{
    margin-left:3px; margin-top:18px;
    font:700 16px/1 var(--sans);
    padding:3px 10px; border-radius:7px 12px 12px 12px;
    white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .cursor.pooria svg{ color:var(--amber); }
  .cursor.pooria .cursor-label{ background:var(--amber); color:var(--amber-ink); }
  .cursor.alex svg{ color:var(--blue); }
  .cursor.alex .cursor-label{ background:var(--blue); color:#fff; }
  .cursor.sam svg{ color:var(--red); }
  .cursor.sam .cursor-label{ background:var(--red); color:#fff; }

  .selection-bar{ position:absolute; border-radius:4px; pointer-events:none; opacity:1; transition:opacity .6s ease; }

  /* ---- chat bubbles (pop in near sender) ---- */
  .bubble{
    position:absolute; max-width:360px;
    font:20px/1.4 var(--sans);
    padding:10px 16px; border-radius:18px 18px 18px 4px;
    color:#fff; background:#1b212c; border:1px solid var(--edge);
    box-shadow:0 15px 39px -12px rgba(0,0,0,.6);
    opacity:0; transform:translateY(12px) scale(.9);
    transition:opacity .3s ease, transform .34s cubic-bezier(.16,1.3,.4,1);
    z-index:7; pointer-events:none;
  }
  .bubble.show{ opacity:1; transform:none; }
  .bubble .who{ font-weight:700; margin-right:7px; }
  .bubble.alex{ background:#101a2e; border-color:rgba(59,130,246,.3); }
  .bubble.alex .who{ color:#8ec1ff; }
  .bubble.sam{ background:#241317; border-color:rgba(229,72,77,.3); }
  .bubble.sam .who{ color:#ff9b9e; }
  .bubble.pooria{ background:#241a06; border-color:rgba(245,165,36,.3); }
  .bubble.pooria .who{ color:#ffcf80; }
  .bubble.cmd{ font-family:var(--mono); }

  /* ---- chat bar ---- */
  .chat-bar{
    position:absolute; left:30px; right:30px; top:735px; height:69px;
    display:flex; align-items:center; gap:12px;
    padding:0 18px;
    background:rgba(255,255,255,.03); border:1px solid var(--edge); border-radius:15px;
  }
  .chat-prompt{ color:var(--amber); font:700 21px/1 var(--mono); }
  .driver-badge{
    display:flex; align-items:center; gap:9px;
    font:600 16px/1 var(--sans); white-space:nowrap;
    padding:6px 13px; border-radius:99px;
    background:rgba(245,165,36,.12); color:#ffcf80;
    border:1px solid rgba(245,165,36,.35);
    transition:background .35s ease, color .35s ease, border-color .35s ease;
  }
  .driver-badge .glyph{ font-size:13px; }
  .driver-badge.blue{ background:rgba(59,130,246,.12); color:#8ec1ff; border-color:rgba(59,130,246,.35); }
  .chat-typing{ flex:1; font:20px/1 var(--mono); color:var(--text-1); white-space:nowrap; overflow:hidden; }
  .chat-typing .typed::after{ content:"▌"; color:var(--text-1); animation:cb 1s steps(2) infinite; margin-left:2px; }

  /* ---- status bar ---- */
  .statusbar{
    position:absolute; left:0; right:0; top:810px; height:60px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
    background:var(--panel-2); border-top:1px solid var(--edge);
    font:17px/1 var(--mono); color:var(--text-2);
  }
  .status-right{ display:flex; align-items:center; gap:21px; }
  .local-badge{ display:flex; align-items:center; gap:9px; color:var(--text-1); padding:5px 13px; border-radius:99px; background:rgba(61,220,132,.08); border:1px solid rgba(61,220,132,.22); }
  .pulse-dot{ width:9px; height:9px; border-radius:50%; background:var(--green); animation:pulse 2.4s ease-out infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(61,220,132,.5);} 70%{ box-shadow:0 0 0 9px rgba(61,220,132,0);} 100%{ box-shadow:0 0 0 0 rgba(61,220,132,0);} }

  /* ============ HOOK OVERLAY ============ */
  .hook{
    position:absolute; inset:0; z-index:25;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .8s ease;
    background:radial-gradient(closest-side, rgba(7,8,11,.55), rgba(7,8,11,0) 70%);
    pointer-events:none;
  }
  .hook.show{ opacity:1; }
  .hook-inner{ text-align:center; }
  .hook-line{
    font:300 45px/1.35 var(--sans);
    color:rgba(232,234,240,.74);
    letter-spacing:.01em;
  }
  .hook-line .em{ font-weight:500; }

  /* ============ END CARD ============ */
  .endcard{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .9s ease;
    background:radial-gradient(80% 60% at 50% 38%, rgba(245,165,36,.10), transparent 70%);
  }
  .endcard.show{ opacity:1; }

  .wordmark{
    font:800 138px/1 var(--sans);
    letter-spacing:-.045em;
    color:var(--text-0);
    display:inline-flex; align-items:baseline;
    clip-path:inset(0 100% 0 0);
    opacity:0;
    transition:clip-path .95s cubic-bezier(.16,1,.3,1), opacity .5s ease;
  }
  .wordmark .live{ color:var(--amber); }
  .wordmark .blk{
    display:inline-block; width:.46em; height:.78em; margin-left:.04em;
    background:var(--amber); transform:translateY(.04em);
    box-shadow:0 0 33px rgba(245,165,36,.6);
    animation:cb 1.05s steps(2) infinite;
  }
  .endcard.show .wordmark{ clip-path:inset(0 0 0 0); opacity:1; }

  .tagline{
    margin-top:27px;
    font:400 34px/1.3 var(--sans);
    color:var(--text-1); letter-spacing:.005em;
    opacity:0; transform:translateY(12px);
    transition:opacity .6s ease .35s, transform .6s cubic-bezier(.16,1,.3,1) .35s;
  }
  .endcard.show .tagline{ opacity:1; transform:none; }

  .install{
    margin-top:51px;
    display:inline-flex; align-items:center;
    font:22px/1 var(--mono);
    padding:19px 27px;
    background:#0b0d12; border:1px solid var(--edge); border-radius:16px;
    box-shadow:0 21px 51px -21px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04) inset;
    opacity:0; transform:translateY(12px);
    transition:opacity .5s ease .6s, transform .5s cubic-bezier(.16,1,.3,1) .6s;
  }
  .endcard.show .install{ opacity:1; transform:none; }
  .install .pmt{ color:var(--amber); font-weight:700; margin-right:13px; }
  .install .cmd{ color:var(--text-0); }
  .install .cmd::after{ content:"▌"; color:var(--amber); margin-left:3px; animation:cb 1s steps(2) infinite; }

  .suite{
    position:absolute; bottom:69px; left:0; right:0;
    font:600 19px/1 var(--sans);
    color:var(--text-2); letter-spacing:.16em; text-transform:uppercase;
    opacity:0; transition:opacity .6s ease;
    display:flex; align-items:center; justify-content:center; gap:13px;
  }
  .suite .diamond{ color:var(--amber); font-size:13px; }
  .endcard.show .suite{ opacity:1; transition-delay:1.5s; }

  /* ---- toast (handoff) ---- */
  .toast{
    position:absolute; left:50%; top:176px; transform:translate(-50%,-12px);
    z-index:20;
    font:600 19px/1 var(--sans); color:#ffcf80;
    padding:10px 19px; border-radius:99px;
    background:rgba(245,165,36,.1); border:1px solid rgba(245,165,36,.3);
    box-shadow:0 12px 33px -15px rgba(0,0,0,.6);
    opacity:0; transition:opacity .35s ease, transform .45s cubic-bezier(.16,1.3,.4,1);
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast.blue{ color:#8ec1ff; background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.3); }
</style>
</head>
<body>
<div class="canvas" id="canvas">

  <!-- ============ TERMINAL ============ -->
  <div class="terminal" id="terminal">
    <div class="titlebar">
      <div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      <div class="path">~/checkout — claude</div>
      <div class="tb-right">
        <div class="presence" id="presence">
          <div class="avatar host entered" style="background:#f5a524;color:#241a04">P</div>
          <div class="avatar" id="av-alex" style="background:#3b82f6;color:#fff">A</div>
          <div class="avatar" id="av-sam" style="background:#e5484d;color:#fff">S</div>
          <div class="driver-ring" id="driverRing" style="left:-6px"></div>
        </div>
      </div>
    </div>

    <div class="term-body" id="termBody">
      <div class="term-header">
        <svg class="mascot mascot-svg" viewBox="0 0 40 40" width="45" height="45" aria-hidden="true">
          <ellipse cx="20" cy="23" rx="15" ry="13" fill="#f5a524"/>
          <ellipse cx="14" cy="16" rx="5" ry="3.4" fill="#fff" opacity=".25"/>
          <g class="eyes">
            <ellipse cx="14.5" cy="22" rx="2.1" ry="2.6" fill="#241a04"/>
            <ellipse cx="25.5" cy="22" rx="2.1" ry="2.6" fill="#241a04"/>
          </g>
        </svg>
        <div>
          <div class="welcome">Welcome back, <span class="name">pooria</span></div>
          <div class="subline">Sonnet 5 · ~/checkout · solo</div>
        </div>
      </div>

      <div class="term-feed" id="feed"></div>

      <div class="cursor-layer" id="cursorLayer">
        <div class="cursor pooria" id="cur-pooria"><svg viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.2 22 L15.3 20.6 L12.1 14 L18.2 14 Z" fill="currentColor"/></svg><span class="cursor-label">pooria</span></div>
        <div class="cursor alex" id="cur-alex"><svg viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.2 22 L15.3 20.6 L12.1 14 L18.2 14 Z" fill="currentColor"/></svg><span class="cursor-label">alex</span></div>
        <div class="cursor sam" id="cur-sam"><svg viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.2 22 L15.3 20.6 L12.1 14 L18.2 14 Z" fill="currentColor"/></svg><span class="cursor-label">sam</span></div>
      </div>
    </div>

    <div class="chat-bar">
      <span class="chat-prompt">›</span>
      <div class="driver-badge" id="driverBadge"><span class="glyph">►</span><span id="driverName">pooria driving</span></div>
      <div class="chat-typing"><span class="typed" id="typedInput"></span></div>
    </div>

    <div class="statusbar">
      <div class="status-left">manual mode · type to chat · <span id="count">1 in session</span></div>
      <div class="status-right">
        <span class="local-badge"><span class="pulse-dot"></span>local · p2p · no data out</span>
      </div>
    </div>
  </div>

  <!-- handoff toast -->
  <div class="toast" id="toast">↻ alex took the wheel</div>

  <!-- ============ HOOK ============ -->
  <div class="hook" id="hook">
    <div class="hook-inner">
      <div class="hook-line">coding with an agent</div>
      <div class="hook-line"><span class="em">is lonely.</span></div>
    </div>
  </div>

  <!-- ============ END CARD ============ -->
  <div class="endcard" id="endcard">
    <div class="wordmark">vibe<span class="live">live</span><span class="blk"></span></div>
    <div class="tagline">multiplayer for coding agents</div>
    <div class="install"><span class="pmt">$</span><span class="cmd" id="cmd"></span></div>
    <div class="suite"><span class="diamond">◆</span> part of the Vibe Suite</div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- scale the 1920x1080 canvas to fit the viewport ---------- */
  var canvas = document.getElementById("canvas");
  function fit(){
    var s = Math.min(innerWidth/1920, innerHeight/1080);
    canvas.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  fit();
  addEventListener("resize", fit);

  /* ---------- tiny helpers ---------- */
  var $ = function(id){ return document.getElementById(id); };
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  var feed   = $("feed");
  var termBody = $("termBody");
  var cursorLayer = $("cursorLayer");
  var MAX = 11;

  function addLine(html, cls){
    var d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.innerHTML = html;
    feed.appendChild(d);
    while(feed.children.length > MAX) feed.removeChild(feed.firstChild);
    return d;
  }
  function addDiff(del, add){
    var w = document.createElement("div");
    w.className = "diff";
    w.innerHTML = '<div class="del">'+del+'</div><div class="add">'+add+'</div>';
    feed.appendChild(w);
    while(feed.children.length > MAX) feed.removeChild(feed.firstChild);
    return w;
  }
  function typeInto(el, text, speed){
    return new Promise(function(resolve){
      var i = 0;
      var t = setInterval(function(){
        el.textContent = text.slice(0, ++i);
        while(feed.children.length > MAX) feed.removeChild(feed.firstChild);
        if(i > text.length){ clearInterval(t); resolve(); }
      }, speed);
    });
  }
  function moveCursor(id, x, y, dur){
    var el = $("cur-"+id);
    el.style.transitionDuration = dur + "s";
    el.style.transform = "translate3d("+x+"px,"+y+"px,0)";
  }
  function snapCursor(id, x, y){
    var el = $("cur-"+id);
    el.style.transition = "none";
    el.style.transform = "translate3d("+x+"px,"+y+"px,0)";
    el.offsetWidth; /* reflow */
    el.style.transition = "";
  }
  function showCursor(id, on){ $("cur-"+id).style.opacity = on ? "1" : "0"; }

  /* selection highlight bar */
  function highlight(rgb, x, y, w, h){
    var b = document.createElement("div");
    b.className = "selection-bar";
    b.style.cssText = "left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px;background:rgba("+rgb+",.22);";
    cursorLayer.appendChild(b);
    setTimeout(function(){ b.style.opacity = "0"; }, 650);
    setTimeout(function(){ b.remove(); }, 1300);
  }

  function bubble(who, html, x, y){
    var b = document.createElement("div");
    b.className = "bubble " + who;
    b.style.left = x + "px"; b.style.top = y + "px";
    b.innerHTML = '<span class="who">'+who+'</span>'+html;
    termBody.appendChild(b);
    requestAnimationFrame(function(){ b.classList.add("show"); });
    setTimeout(function(){ b.classList.remove("show"); }, 1900);
    setTimeout(function(){ b.remove(); }, 2400);
  }

  function toast(text){
    var t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1700);
  }

  /* ---------- full reset at the top of every loop ---------- */
  function reset(){
    feed.innerHTML = "";
    termBody.querySelectorAll(".bubble").forEach(function(n){ n.remove(); });
    cursorLayer.querySelectorAll(".selection-bar").forEach(function(n){ n.remove(); });

    $("terminal").classList.remove("alive","recede");

    $("hook").classList.remove("show");
    $("endcard").classList.remove("show");
    $("cmd").textContent = "";

    /* presence: only pooria to start */
    $("av-alex").classList.remove("entered");
    $("av-sam").classList.remove("entered");

    var ring = $("driverRing");
    ring.classList.remove("on");
    ring.style.left = "-6px";
    ring.style.borderColor = "var(--amber)";
    ring.style.boxShadow = "0 0 0 4px rgba(245,165,36,.18), 0 0 21px rgba(245,165,36,.5)";

    var badge = $("driverBadge");
    badge.classList.remove("blue");
    $("driverName").textContent = "pooria driving";

    $("count").textContent = "1 in session";
    $("typedInput").textContent = "";
    var sl = document.querySelector(".subline"); if(sl) sl.textContent = "Sonnet 5 · ~/checkout · solo";

    showCursor("pooria", false);
    showCursor("alex", false);
    showCursor("sam", false);
    snapCursor("pooria", 345, 225);
    snapCursor("alex", 1620, -60);
    snapCursor("sam", -90, 300);
  }

  var cancelled = false;
  function guard(){ if(cancelled) throw new Error("cancel"); }

  /* ============== THE TIMELINE (~20s) ============== */
  async function play(){
    reset();
    try{

      /* ===== BEAT 1 — LONELY (0 – ~5.6s) ===== */
      await wait(300); guard();
      showCursor("pooria", true);
      moveCursor("pooria", 450, 315, 2.6);

      await wait(250); guard();
      var l1 = addLine("", "agent caret");
      await typeInto(l1, "Reading the codebase to get oriented…", 26);
      l1.classList.remove("caret");

      await wait(520); guard();
      $("hook").classList.add("show");

      await wait(900); guard();
      moveCursor("pooria", 300, 405, 2.4);
      var l2 = addLine("", "agent caret");
      await typeInto(l2, "I'll start with the checkout module.", 26);
      l2.classList.remove("caret");

      await wait(1100); guard();
      moveCursor("pooria", 540, 225, 2.6);

      await wait(700); guard();
      $("hook").classList.remove("show");   /* hook fades, beat ends */

      /* ===== BEAT 2 — FRIENDS JOIN (5.6s – ~13.9s) ===== */
      await wait(450); guard();            /* ~5.6s */

      /* alex knocks: avatar pops, cursor glides in, color returns */
      $("av-alex").classList.add("entered");
      showCursor("alex", true);
      moveCursor("alex", 1230, 180, 1.5);
      $("terminal").classList.add("alive");           /* grayscale -> color */
      $("count").textContent = "2 in session";

      await wait(520); guard();
      bubble("alex", "hey 👋 mind if I join?", 1140, 105);

      await wait(680); guard();            /* ~7.3s */
      /* sam joins */
      $("av-sam").classList.add("entered");
      showCursor("sam", true);
      moveCursor("sam", 180, 450, 1.6);
      $("count").textContent = "3 in session";

      await wait(360); guard();
      bubble("sam", "pulling up alongside", 90, 375);

      await wait(620); guard();            /* ~8.3s */
      moveCursor("alex", 810, 345, 1.4);
      moveCursor("sam", 450, 480, 1.4);
      var l3 = addLine("", "agent caret");
      await typeInto(l3, "On it — adding the discount helper.", 22);
      l3.classList.remove("caret");

      await wait(360); guard();
      addLine('<span class="bullet">⏺</span><span class="tn">Edit</span> <span class="ta">src/pricing.ts</span>', "tool");
      moveCursor("pooria", 540, 375, 1.1);
      moveCursor("alex", 705, 435, 1.1);

      await wait(420); guard();            /* ~9.5s */
      addDiff("- return price;", "+ return price * (1 - discount);");
      highlight("18,176,134", 66, 308, 540, 33);

      await wait(620); guard();            /* ~10.1s */
      bubble("pooria", "/release — your turn, alex", 560, 560);

      /* ---- CONTROL HANDOFF ---- */
      await wait(520); guard();            /* ~10.6s */
      var ring = $("driverRing");
      ring.classList.add("on");
      ring.style.left = "21px";             /* pooria -> alex avatar */
      setTimeout(function(){
        ring.style.borderColor = "#3b82f6";
        ring.style.boxShadow = "0 0 0 4px rgba(59,130,246,.18), 0 0 21px rgba(59,130,246,.5)";
      }, 360);
      var badge = $("driverBadge");
      badge.classList.add("blue");
      $("driverName").textContent = "alex driving";
      toast("↻ alex took the wheel");
      var sl = document.querySelector(".subline"); if(sl) sl.textContent = "Sonnet 5 · ~/checkout · 3 live";

      await wait(780); guard();            /* ~11.4s */
      moveCursor("alex", 1080, 630, 1.0);   /* alex drifts toward the chat bar */

      /* alex types into the shared agent */
      var typed = $("typedInput");
      await typeInto(typed, "run the tests", 60);

      await wait(360); guard();            /* ~12.2s */
      typed.textContent = "";
      var l4 = addLine("", "agent caret");
      await typeInto(l4, "Running the test suite…", 24);
      l4.classList.remove("caret");

      await wait(300); guard();
      var sEl = addLine('<span class="bullet spin">⠋</span>running 42 tests…', "agent");
      var frames = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
      var fi = 0;
      var spin = setInterval(function(){
        var s = sEl.querySelector(".spin"); if(s) s.textContent = frames[fi++ % frames.length];
      }, 80);

      await wait(1150); guard();            /* ~13.4s */
      clearInterval(spin);
      sEl.className = "line ok";
      sEl.innerHTML = "✓ 42 passed in 1.2s";
      moveCursor("sam", 540, 570, 1.0);
      moveCursor("pooria", 300, 630, 1.0);

      await wait(520); guard();             /* ~13.9s */
      bubble("alex", "green ✓ ship it", 1050, 540);

      /* ===== BEAT 3 — END CARD (13.9s – ~20s) ===== */
      await wait(380); guard();             /* ~14.3s */
      $("terminal").classList.add("recede");
      $("endcard").classList.add("show");

      await wait(900); guard();             /* wordmark reveals */
      /* type the install command */
      var cmd = $("cmd");
      var full = "npx vibelive";
      await typeInto(cmd, full, 42);

      await wait(2100); guard();            /* hold on the card */

      /* gentle out, then loop */
      await wait(150);
      $("endcard").classList.remove("show");
      await wait(700);

    } catch(e){
      if(e.message !== "cancel") throw e;
      return;
    }
    if(!cancelled) play();
  }

  /* pause cleanly when the tab is hidden, restart on return */
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      cancelled = true;
    } else if(cancelled){
      cancelled = false;
      play();
    }
  });

  play();
})();
</script>
</body>
</html>
