name: oxlint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: oxlint (agent budgets — enforced)
        run: bunx oxlint@^1 --config .oxlintrc.json
